        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script src="https://code.jquery.com/jquery-4.0.0.js" integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
        <script>
            document.addEventListener('DOMContentLoaded', function() {
                const button1 = document.getElementById('Add');
                const target = document.getElementById('Adding');
                const cardsContainer = document.getElementById('Shows-cards'); // Ensure this matches your grid row ID

                // ==========================================
                // 1. LOAD PERSISTENT CARDS ON PAGE LOAD
                // ==========================================
                // Retrieve previous user-added cards from localStorage. If none exist, start with an empty array.
                const savedCardsArray = JSON.parse(localStorage.getItem("myPersistentCards")) || [];

                // Loop through the stored HTML card structures and inject them safely next to your hard-built cards
                    savedCardsArray.forEach(htmlChunk => {
                    // You can change 'beforeend' or 'beforebegin' based on your layout needs
                    button1.insertAdjacentHTML("beforebegin", htmlChunk);
                });

                // ==========================================
                // 2. TOGGLE MODAL / OVERLAY
                // ==========================================
                    button1.addEventListener('click', () => {
                    target.style.display = 'block';
                    document.getElementById('overlay').style.display = 'block';
                });

                // ==========================================
                // 3. FILE UPLOAD TRACKER
                // ==========================================
                const image = [];

                document.querySelector('.file').addEventListener('change', function(event) {
                    const files = event.target.files;
                    image.length = 0; // Clear previous selections so it handles the newest upload cleanly

                    for (let i = 0; i < files.length; i++) {
                        image.push(files[i]);
                    }
                });

                // ==========================================
                // 4. FORM SUBMISSION & BASE64 STORAGE LOGIC
                // ==========================================
                document.querySelector('form').addEventListener('submit', function(submit) {
                    submit.preventDefault();

                    let title = document.getElementById('title').value;

                    if (title !== '' && image.length > 0) {
                        const first = image[0];

                        // Initialize FileReader to convert binary file data into a permanent Base64 string
                        const reader = new FileReader();

                        reader.onload = function(e) {
                            const base64Url = e.target.result; // This acts as your permanent image address

                            // Construct your HTML layout strings using the permanent Base64 source
                            const imagePreview = `<img src="${base64Url}" class="card-img-top rounded-4" alt="${title}">`;

                            const html = `<div class="col-4 mb-4">
                                            <div class="card rounded-4">
                                                ${imagePreview}
                                            </div>
                                        </div>`;

                            // A) Paste it instantly onto the screen exactly where you specified
                            button1.insertAdjacentHTML("beforebegin", html);

                            // B) Push this brand new HTML chunk into our structural persistence array
                            savedCardsArray.push(html);

                            // C) Save the modified array string into the browser's database file
                            localStorage.setItem("myPersistentCards", JSON.stringify(savedCardsArray));

                            // Clear out the input values inside the modal so it's clean for the next use
                            document.getElementById('title').value = '';
                            document.querySelector('.file').value = '';
                            image.length = 0;
                        };

                        // Convert the uploaded image asset into a text data URL
                        reader.readAsDataURL(first);
                    } else {
                        alert("Please fill out the title and select an image!");
                    }

                    // Hide form fields and close overlays safely
                    target.style.display = 'none';
                    document.getElementById('overlay').style.display = 'none';
                });
            });
        </script>
        <title>My Watchlist</title>
    </head>
