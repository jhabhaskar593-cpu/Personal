        <script>
            document.addEventListener('DOMContentLoaded', function() {
                let permadict = JSON.parse(localStorage.getItem('myStoredList')) || [];

                function update() {
                    const containerPhy = document.querySelector('.added_phy');
                    const containerChem = document.querySelector('.added_chem');
                    const containerMaths = document.querySelector('.added_maths');

                    if (containerPhy) containerPhy.innerHTML = '';
                    if (containerChem) containerChem.innerHTML = '';
                    if (containerMaths) containerMaths.innerHTML = '';

                    let htmlp = '';
                    let htmlc = '';
                    let htmlm = '';

                    let length = permadict.length;
                    for (let i = 0; i < length; i++) {
                        if (permadict[i].sub == 'phy') {
                            htmlp += `<h4 class="p-3">${permadict[i].chap}</h4>`;
                        } else if (permadict[i].sub == 'chem') {
                            htmlc += `<h4 class="p-3">${permadict[i].chap}</h4>`;
                        } else if (permadict[i].sub == 'maths') {
                            htmlm += `<h4 class="p-3">${permadict[i].chap}</h4>`;
                        }
                    }

                    if (containerPhy) containerPhy.innerHTML = htmlp;
                    if (containerChem) containerChem.innerHTML = htmlc;
                    if (containerMaths) containerMaths.innerHTML = htmlm;
                }

                update();

                function percent() {
                    document.querySelector('#percentp').style.width = '0%';
                    document.querySelector('#percentc').style.width = '0%';
                    document.querySelector('#percentm').style.width = '0%';
                    document.querySelector('#totalper').style.width = '0%';

                    let length = permadict.length;
                    let p = Phy.length;
                    let c = Chem.length;
                    let m = Maths.length;
                    let nop = 0;
                    let nom = 0;
                    let noc = 0;

                    for (let i = 0; i < length; i++) {
                        if (permadict[i].sub == 'phy') {
                            nop++;
                        } else if (permadict[i].sub == 'chem') {
                            noc++;
                        } else if (permadict[i].sub == 'maths') {
                            nom++;
                        }
                    }

                    let perp = (nop/p) * 100;
                    let perc = (noc/c) * 100;
                    let perm = (nom/c) * 100;

                    let total = ((nop + noc + nom) / (p + c + m)) * 100;

                    document.querySelector('#percentp').style.width = String(perp) + '%';
                    document.querySelector('#percentc').style.width = String(perc) + '%';
                    document.querySelector('#percentm').style.width = String(perm) + '%';
                    document.querySelector('#totalper').style.width = String(total) + '%';
                }

                percent();

                document.querySelector('.Entry').addEventListener('click', function(add) {
                    let value = document.querySelector('.input').value.trim();
                    let phy = false;
                    let maths = false;
                    let chem = false;
                    let key = '';

                    for (let chaps of Phy) {
                        if (chaps == value) {
                            key = 'phy';
                            phy = true;
                        }
                    }
                    if (!phy) {
                        for (let chaps of Chem) {
                            if (chaps == value) {
                                key = 'chem';
                                chem = true;
                            }
                        }
                        if (!chem) {
                            for (let chaps of Maths) {
                                if (chaps == value) {
                                    key = 'maths';
                                    maths = true;
                                }
                            }
                        }
                    }

                    let newEntry = {sub: key, chap: value};
                    permadict.push(newEntry);

                    localStorage.setItem('myStoredList', JSON.stringify(permadict));

                    update();
                    percent();

                    document.querySelector('.input').value = '';
                });
            });
        </script>
        <title>My Syllabus</title>
